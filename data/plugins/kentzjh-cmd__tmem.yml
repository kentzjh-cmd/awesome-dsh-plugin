url: https://github.com/kentzjh-cmd/tmem
name: kentzjh-cmd/tmem
category: memory
description:
  en: 'Project-scoped deterministic execution trace memory and zero-token session digest plugin for DSH (v0.3.1, pure Node.js ESM >=22.5.0 with zero Python or external runtime dependencies), compiling session histories via temporal causal slicing and structural AST symbol attribution into guarded L0/L1/L2 playbooks with inline session_id lineage. Registers /tmem (status, list, forget, gc, telemetry, bench, evaluate, inspect, replay, diff, sync), recalls memories in agent/pre-step only on explicit file-path or error anchors (skipping unchanged repeated steps), and intercepts tools/post-execute errors and code edits with same-origin L2 fixes, failure-loop warnings, statistical L1 co-change partner hints, milestone prompts, and runtime adoption telemetry (skipping idle read calls). Resolves hooks in-process when loaded alongside dsh-tmem (falling back to async node CLI execution with a 5-second timeout when deployed standalone), uses built-in node:sqlite FTS5, stores all data strictly inside each project''s .tmem/ directory plus MEMORIES.md/MEM.md (no ~/.tmem/ global store), and makes no network requests.'
  zh: '面向 DSH 的项目级确定性执行轨迹记忆与零额外 token 历史会话摘要插件（v0.3.1，纯 Node.js ESM >=22.5.0 实现，零 Python 与外部运行时依赖），通过时间因果切片与结构化 AST 符号归因将会话提炼为带守卫条件的 L0/L1/L2 执行剧本及内联 session_id 溯源摘要。注册 /tmem 命令（status、list、forget、gc、telemetry、bench、evaluate、inspect、replay、diff、sync），在 agent/pre-step 仅基于显式文件路径或报错锚点召回记忆（跳过输入未变的重复步骤），并在 tools/post-execute 对报错和代码修改提供同源 L2 修复、死循环熔断警告、统计 L1 共变搭档提醒、里程碑提示与采纳率遥测（空闲时跳过常规读取工具）。与 dsh-tmem 同环境加载时在进程内直调钩子（独立单文件部署时回退为 5 秒超时的异步 node CLI 子进程），内置 node:sqlite FTS5 索引，所有数据仅存于各项目 .tmem/ 目录及 MEMORIES.md/MEM.md（无 ~/.tmem/ 全局存储），不发任何网络请求。'
